<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тестовый сайт</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(720px, 100%); padding: clamp(28px, 7vw, 64px); border-radius: 24px; background: white; box-shadow: 0 20px 70px #23395d18; }
    .tag { display: inline-block; padding: 7px 12px; border-radius: 999px; color: #3157c8; background: #edf2ff; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    h1 { margin: 22px 0 14px; font-size: clamp(36px, 8vw, 58px); line-height: 1.05; letter-spacing: -.04em; }
    p { max-width: 52ch; color: #647089; font-size: 18px; line-height: 1.65; }
    button { margin-top: 16px; padding: 13px 20px; border: 0; border-radius: 12px; background: #3157c8; color: white; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s, background .15s; }
    button:hover { background: #2445a8; transform: translateY(-2px); }
    #message { min-height: 28px; margin-top: 16px; color: #3157c8; font-weight: 600; }
    footer { margin-top: 42px; color: #9aa4b6; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">Тестовая страница</span>
    <h1>Привет! Это мой сайт 👋</h1>
    <p>Небольшая стартовая страница для проверки. Здесь можно попробовать оформление, текст и простую интерактивность.</p>
    <button id="hello">Нажми меня</button>
    <div id="message" aria-live="polite"></div>
    <footer>Сделано для теста · 2026</footer>
  </main>
  <script>
    document.querySelector('#hello').addEventListener('click', () => {
      document.querySelector('#message').textContent = 'Отлично — кнопка работает!';
    });
  </script>
</body>
</html>
